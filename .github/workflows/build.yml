name: Build & Release

on:
  push:
    branches: [main, 1.21.x]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fabric-121x
            dir: mc-1-21-x
            java: 21
            cmd: |
              for v in 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11; do
                ./gradlew build --console=plain -Pmc_version=$v || exit 1
              done
          - name: fabric-1211
            dir: mc-1-21-1
            java: 21
            cmd: ./gradlew build --console=plain
          - name: neoforge-1211
            dir: mc-1-21-1-neoforge
            java: 21
            cmd: ./gradlew build --console=plain
          - name: neoforge-1214
            dir: mc-1-21-4-neoforge
            java: 21
            cmd: ./gradlew build --console=plain
          - name: neoforge-12111
            dir: mc-1-21-11-neoforge
            java: 25
            cmd: ./gradlew build --console=plain

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Strip local JAVA_HOME pin
        run: |
          for p in mc-1-21-1-neoforge mc-1-21-4-neoforge mc-1-21-11-neoforge mc-1-21-x mc-1-21-1; do
            sed -i '/org.gradle.java.home/d' "$p/gradle.properties" || true
          done

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmd }}

      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.name }}
          path: |
            ${{ matrix.dir }}/build/libs/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars

      - name: Generate release notes
        run: python3 scripts/gen-release-notes.py > /tmp/release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          files: jars/**/*.jar