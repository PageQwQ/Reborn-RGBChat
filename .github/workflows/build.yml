name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fabric-26x
            dir: mc-26-x
            java: 25
            cmd: ./gradlew build --console=plain -Pmc_version=26.2 && ./gradlew build --console=plain -Pmc_version=26.1.2
          - name: neoforge-26x
            dir: mc-26-x-neoforge
            java: 25
            cmd: ./gradlew build --console=plain -Pneoforge_version=26.2.0.53-beta && ./gradlew build --console=plain -Pneoforge_version=26.1.2.94
          - name: neoforge-1211
            dir: mc-1-21-1-neoforge
            java: 21
            cmd: ./gradlew build --console=plain
          - name: neoforge-1214
            dir: mc-1-21-4-neoforge
            java: 21
            cmd: ./gradlew build --console=plain
          - name: neoforge-12111
            dir: mc-1-21-11-neoforge
            java: 25
            cmd: ./gradlew build --console=plain

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Strip local JAVA_HOME pin
        run: |
          for p in mc-26-x mc-26-x-neoforge mc-1-21-1-neoforge mc-1-21-4-neoforge mc-1-21-11-neoforge; do
            sed -i '/org.gradle.java.home/d' "$p/gradle.properties" || true
          done

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmd }}

      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.name }}
          path: |
            ${{ matrix.dir }}/build/libs/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars

      - name: Generate release notes
        run: python3 scripts/gen-release-notes.py > /tmp/release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          files: jars/**/*.jar