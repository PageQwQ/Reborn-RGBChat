plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

def versionInfo = [
        '26.1.2': [neo: '26.1.2.94',      mc: '26.1.2', mcRange: '[26.1.2,26.2)'],
        '26.2':   [neo: '26.2.0.53-beta', mc: '26.2',    mcRange: '[26.2,26.3)'],
]
def neo = project.hasProperty('neoforge_version') ? project.property('neoforge_version') : project.property('neoforge_version')
neo = (String) neo
def info = versionInfo.find { k, v -> v.neo == neo }
if (info == null) {
    throw new GradleException("未知版本: ${neo}，支持: ${versionInfo.values().collect { it.neo }.join(', ')}")
}

version = "${info.value.mc}-${mod_version}"
group = project.maven_group
base.archivesName = project.archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neo

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Shared pure-Java common sources (Mojang-named classes)
sourceSets {
    main {
        java.srcDirs += file('../common')
    }
}

processResources {
    def mcVersion = info.value.mc
    def props = [
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            neo_version          : neo,
            minecraft_version    : mcVersion,
            minecraft_version_range: info.value.mcRange,
    ]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}